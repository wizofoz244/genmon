<!DOCTYPE html>
<html lang="en" data-theme="{{ theme|default('dark') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta http-equiv="cache-control" content="no-cache">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">
    <title>Genmon</title>
    <style>
        :root {
            --bg-0: #090e1a;
            --text-0: #e4eaf4;
            --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        [data-theme~="light"] {
            --bg-0: #f0f2f5;
            --text-0: #1a1a2e;
        }
        html, body {
            background-color: var(--bg-0) !important;
            color: var(--text-0) !important;
            font-family: var(--font) !important;
            margin: 0;
            padding: 0;
            height: 100%;
        }
        .app.hidden {
            display: none !important;
        }
        .loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-0) !important;
            color: var(--text-0) !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-family: var(--font) !important;
        }
        .loader-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(59,130,246,0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="manifest" href="manifest.webmanifest?v={{ asset_ver('manifest.webmanifest') }}">
    <meta name="theme-color" content="#090e1a">
    <link rel="icon" href="favicon.ico?v={{ asset_ver('favicon.ico') }}">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v={{ asset_ver('icons/apple-touch-icon.png') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
    // Re-inject the stylesheet if it fails to load (flaky/low-bandwidth links),
    // so the dashboard is never left unstyled after login.
    window.__cssRetry = function (el) {
        var n = parseInt(el.dataset.tries || '0', 10);
        if (n >= 3) return;
        el.dataset.tries = n + 1;
        var base = el.getAttribute('href').split('?')[0];
        setTimeout(function () { el.setAttribute('href', base + '?r=' + Date.now()); }, 600);
    };
    </script>
    {% if inline_css %}
    <style>{{ inline_css|safe }}</style>
    {% else %}
    <link rel="stylesheet" href="css/genmon.css?v={{ asset_ver('css/genmon.css') }}" onerror="__cssRetry(this)">
    {% endif %}
    <script src="js/system-theme.js?v={{ asset_ver('js/system-theme.js') }}"></script>
</head>
<body>
    <!-- Loading overlay -->
    <div id="loader" class="loader active">
        <div class="loader-spinner"></div>
        <div class="loader-text">Loading Genmon…</div>
    </div>

    <!-- App shell -->
    <div id="app" class="app hidden">
        <!-- Mobile sidebar backdrop -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">

                    <path fill="currentColor" fill-rule="nonzero" d="M2689 577l-120 0 0 -347 111 0 0 58c19,-23 38,-40 59,-51 21,-11 43,-16 68,-16 36,0 64,10 83,31 19,21 29,52 29,92l0 233 -120 0 0 -199c0,-18 -4,-32 -11,-41 -8,-9 -19,-14 -33,-14 -21,0 -37,7 -49,21 -11,14 -17,35 -17,62l0 171z"/>
                    <path fill="currentColor" stroke="currentColor" stroke-width="57.1" d="M2144 322c12,-21 28,-37 46,-50 41,-30 94,-39 143,-25 54,17 96,61 110,114 8,30 8,60 -1,90 -7,24 -20,46 -37,64 -7,8 -15,15 -24,21 -17,13 -33,20 -53,25 -88,24 -176,-28 -200,-115 -11,-41 -6,-86 16,-124zm224 -72c-56,-33 -127,-26 -181,9 -61,40 -89,119 -70,190 5,20 13,36 24,54 11,16 31,37 53,49l-37 64 10 5 36 -63c57,32 128,25 182,-10 60,-40 89,-119 70,-190 -6,-19 -13,-35 -25,-53 -11,-17 -30,-37 -52,-50l37 -63 -10 -6 -37 64z"/>
                    <path fill="currentColor" stroke="currentColor" stroke-width="34.26" d="M2179 403c4,0 8,1 11,3 4,-16 23,-53 44,-53 30,0 65,113 101,113 18,0 29,-10 39,-23 7,-9 16,-25 19,-38 -4,-1 -8,-2 -11,-4 -2,9 -11,27 -16,33 -33,45 -52,5 -78,-37 -9,-17 -31,-55 -52,-55 -31,0 -52,38 -57,61z"/>
                </svg>
                </a>
            </div>
            <nav id="nav-menu" class="nav-menu" aria-label="Main navigation">
                <a class="nav-item" href="#status" data-page="status"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></a>
                <a class="nav-item" href="#maintenance" data-page="maintenance"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg><span>Maintenance</span></a>
                <a class="nav-item" href="#outage" data-page="outage"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>Outage</span></a>
                <a class="nav-item" href="#logs" data-page="logs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Logs</span></a>
                <a class="nav-item" href="#monitor" data-page="monitor"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg><span>Monitor</span></a>

                <a class="nav-item" href="#scriptlogs" data-page="scriptlogs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Script Logs</span></a>
                <a class="nav-item" href="#backups" data-page="backups"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg><span>Run Backups</span></a>
                <a class="nav-item" href="#settings" data-page="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span>Settings</span></a>
                <a class="nav-item" href="#addons" data-page="addons"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg><span>Add-Ons</span></a>

            </nav>
        </aside>

        <!-- Main area -->
        <main class="main">
            <!-- Header -->
            <header class="header">
                <button id="menu-toggle" class="header-btn menu-toggle" aria-label="Toggle menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <div class="header-info">
                    <span id="site-name" class="site-name">Genmon</span>
                    <span id="monitor-time" class="monitor-time"></span>
                </div>
                <div class="header-actions">
                    <button id="customize-btn" class="header-btn" aria-label="Edit dashboard"
                            title="Edit Dashboard" style="display:none">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                    <button id="theme-toggle" class="header-btn" aria-label="Toggle theme" title="Toggle theme">
                        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <button id="pwa-push-btn" class="header-btn" aria-label="Push Alert Settings" title="Push Alert Settings" onclick="document.getElementById('pwa-push-modal').classList.remove('hidden')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </button>
                    <button id="logout-btn" class="header-btn" aria-label="Log out" title="Log out / Purge Cache">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </button>
                    <div id="indicators" class="hdr-indicators"></div>
                    <div id="status-badge" class="status-badge" data-status="ready">
                        <span class="status-dot"></span>
                        <span id="status-text" class="status-label">--</span>
                    </div>
                </div>
            </header>

            <!-- Alert bar (non-blocking system warnings) -->
            <div id="alert-bar" class="alert-bar"></div>

            <!-- Page content -->
            <div id="content" class="content"></div>

            <!-- Footer -->
            <footer class="footer">
                <span id="footer-version"></span>
                <span id="footer-connection" class="footer-conn"></span>
            </footer>
        </main>
    </div>

    <!-- Modal container -->
    <div id="modal-overlay" class="modal-overlay hidden"></div>

    <!-- PWA Push Notifications Preferences Modal -->
    <div id="pwa-push-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 500px; padding: 20px; border-radius: 12px; background: #111a2e; color: #fff; margin: 40px auto; position: relative; z-index: 10000;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 style="margin: 0; font-size: 1.25rem;">📱 Push Alert Preferences</h3>
                <button type="button" onclick="document.getElementById('pwa-push-modal').classList.add('hidden')" style="background:none; border:none; color:#94a3b8; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div style="margin-bottom: 15px; display:flex; justify-content:space-between; align-items:center; background:#1e293b; padding:10px 14px; border-radius:8px;">
                <div>
                    <strong>Status:</strong> <span id="webpush-status-label" class="badge bg-secondary">Checking...</span>
                </div>
                <div>
                    <button id="btn-webpush-toggle" type="button" onclick="window.GenmonPWA.togglePush()" class="btn btn-primary btn-sm">Enable Push Alerts</button>
                    <button type="button" onclick="window.GenmonPWA.sendTestNotification()" class="btn btn-outline-info btn-sm" style="margin-left: 5px;">Test</button>
                </div>
            </div>
            <div style="margin-bottom: 12px;">
                <label for="webpush-device-name" style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 4px; display: block;">Device Name / Label (Optional):</label>
                <input type="text" id="webpush-device-name" class="form-control form-control-sm" placeholder="e.g. Oz's iPhone, Living Room Tablet" style="background:#1e293b; color:#fff; border:1px solid #334155;">
            </div>
            <div style="margin-bottom: 12px;">
                <label for="pref-vapid_email" style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 4px; display: block;">Apple APNs VAPID Email (Required for iOS):</label>
                <input type="email" id="pref-vapid_email" class="form-control form-control-sm" placeholder="e.g. name@gmail.com" style="background:#1e293b; color:#fff; border:1px solid #334155;">
            </div>
            <h4 style="font-size: 1rem; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 5px;">Trigger Event Options</h4>
            <div style="display:flex; flex-direction:column; gap:10px; max-height: 250px; overflow-y: auto; margin-bottom: 15px;">
                <label for="pref-notify_outage" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
                    <span>⚡ Power Outage / Utility Restored</span>
                    <input type="checkbox" id="pref-notify_outage" checked>
                </label>
                <label for="pref-notify_exercise" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
                    <span>🏋️ Exercise Started / Stopped</span>
                    <input type="checkbox" id="pref-notify_exercise" checked>
                </label>
                <label for="pref-notify_error" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
                    <span>🚨 Alarms & Controller Errors</span>
                    <input type="checkbox" id="pref-notify_error" checked>
                </label>
                <label for="pref-notify_warning" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
                    <span>🔧 Maintenance Service Required</span>
                    <input type="checkbox" id="pref-notify_warning" checked>
                </label>
                <label for="pref-notify_off_manual" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
                    <span>📴 Switch Changed to OFF or MANUAL</span>
                    <input type="checkbox" id="pref-notify_off_manual" checked>
                </label>
                <label for="pref-notify_fuel" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
                    <span>⛽ Low Fuel Warnings</span>
                    <input type="checkbox" id="pref-notify_fuel" checked>
                </label>
                <label for="pref-notify_pi_state" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
                    <span>🌡️ Raspberry Pi Hardware Health</span>
                    <input type="checkbox" id="pref-notify_pi_state" checked>
                </label>
                <label for="pref-notify_sw_update" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
                    <span>ℹ️ Software Updates & System Notices</span>
                    <input type="checkbox" id="pref-notify_sw_update" checked>
                </label>
            </div>
            <h4 style="font-size: 1rem; margin-top: 15px; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 5px;">📱 Subscribed Devices</h4>
            <div id="pwa-subscribed-devices-list" style="max-height: 140px; overflow-y: auto; font-size: 0.85rem; margin-bottom: 15px;">
                <div style="color: #94a3b8; text-align: center; padding: 10px;">Loading registered devices...</div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button type="button" onclick="document.getElementById('pwa-push-modal').classList.add('hidden')" class="btn btn-secondary">Close</button>
                <button type="button" onclick="window.GenmonPWA.savePreferences()" class="btn btn-success">Save Preferences</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/jquery-4.0.0.min.js?v={{ asset_ver('js/jquery-4.0.0.min.js') }}"></script>
    <script src="js/jquery.qrcode.min.js?v={{ asset_ver('js/jquery.qrcode.min.js') }}"></script>
