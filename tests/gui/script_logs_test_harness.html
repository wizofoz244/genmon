<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Script Logs GUI Test Harness</title>
  <link rel="stylesheet" href="../../static/css/genmon.css">
  <script src="../../static/js/jquery-4.0.0.min.js"></script>
  <script>
    window.errors = [];
    window.onerror = function(msg, url, line) {
      window.errors.push({msg: msg, line: line});
    };
  </script>
  <script src="../../static/js/genmon.js"></script>
</head>
<body>
  <div id="content" style="padding:20px;"></div>
  <div id="dashboard-tile" style="padding:20px;">
    <div id="scriptlogs-tile-body"></div>
  </div>
  <script>
    window._server_unack_error = true;
    window._server_last_ack = 0;
    window._ack_calls = [];

    // Mock API on Genmon
    Genmon.api.get = function(endpoint) {
      var d = $.Deferred();
      if (endpoint.indexOf('script_logs_json') !== -1) {
        setTimeout(function() {
          d.resolve({
            sync_log: {
              path: '/etc/genmon/genmaint_sync.log',
              lines: [
                '[2026-08-01 10:00:00] [INFO] Sync daemon initialized.',
                '[2026-08-01 10:05:00] [ERROR] Sync connection timeout to remote endpoint.'
              ],
              has_error: true,
              has_warning: false,
              has_unack_error: window._server_unack_error,
              has_unack_warning: false,
              last_ack_time: window._server_last_ack
            },
            backup_log: { path: '/home/genmonpi/backup.log', lines: ['[INFO] Backup normal.'], has_error: false, has_warning: false, has_unack_error: false, has_unack_warning: false, last_ack_time: 0 },
            sdcard_backup_log: { path: '/home/genmonpi/sdcard_backup.log', lines: ['[INFO] SD Backup normal.'], has_error: false, has_warning: false, has_unack_error: false, has_unack_warning: false, last_ack_time: 0 },
            net_watchdog_log: { path: '/var/log/net-watchdog.log', lines: ['[INFO] Network connected.'], has_error: false, has_warning: false, has_unack_error: false, has_unack_warning: false, last_ack_time: 0 },
            genwebpush_log: { path: '/var/log/genwebpush.log', lines: ['[INFO] Web push active.'], has_error: false, has_warning: false, has_unack_error: false, has_unack_warning: false, last_ack_time: 0 }
          });
        }, 10);
      } else if (endpoint.indexOf('ack_script_log') !== -1) {
        window._ack_calls.push(endpoint);
        window._server_unack_error = false;
        window._server_last_ack = 1785597900;
        setTimeout(function() {
          d.resolve({ result: 'OK', log: 'sync', ack_time: window._server_last_ack });
        }, 10);
      } else {
        setTimeout(function() { d.resolve({}); }, 10);
      }
      return d.promise();
    };

    $(function() {
      Genmon.pages.scriptlogs.render($('#content'));
      Genmon.pages.status._updateScriptLogsTile();
    });
  </script>
</body>
</html>
