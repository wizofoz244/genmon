[genwebpush]
# Enable or disable Web Push Add-on
enable = False

# VAPID Keys for Web Push Authentication (generated automatically on first run if blank)
vapid_public_key =
vapid_private_key =
vapid_claims_sub = mailto:admin@genmon.local

# Notification Event Filter Toggles
notify_outage = True
notify_exercise = True
notify_error = True
notify_warning = True
notify_off_manual = True
notify_fuel = True
notify_pi_state = True
notify_sw_update = True
notify_info = True

# File path to store browser subscription endpoints
subscriptions_file = /etc/genmon/webpush_subscriptions.json
